name: YouTube 新しい動画の確認

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 9:00(日本時間)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube_check.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 新しい動画を探して確認の Issue を作る
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/youtube_check.py
      - name: 結果を記録
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add youtube/videos.json
          git diff --cached --quiet || (git commit -m "YouTube 確認待ちを記録" && git pull --rebase && git push)
